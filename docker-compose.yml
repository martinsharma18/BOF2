# Optional: a PostgreSQL for development if you don't want to use a locally installed one.
# Runs on port 5433 so it doesn't clash with a local PostgreSQL on 5432.
#   docker compose up -d
# Then use: Host=localhost;Port=5433;Database=bof2;Username=bof2;Password=bof2
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bof2
      POSTGRES_USER: bof2
      POSTGRES_PASSWORD: bof2
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
